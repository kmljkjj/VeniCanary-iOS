name: VeniCanary
options:
  bundleIdPrefix: app.venicanary
  deploymentTarget:
    iOS: "15.0"
  # Force format compatible with Xcode 15.x (NOT objectVersion 77 / Xcode 16)
  xcodeVersion: "15.0"
  objectVersion: 56
  createIntermediateGroups: true
settings:
  MARKETING_VERSION: "1.0.1"
  CURRENT_PROJECT_VERSION: "2"
  TARGETED_DEVICE_FAMILY: "1,2"
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"
  SWIFT_VERSION: "5.0"
  CODE_SIGNING_ALLOWED: "NO"
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGN_IDENTITY: ""
  DEVELOPMENT_TEAM: ""
targets:
  VeniCanary:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      BASE_SDK: iphoneos
      SUPPORTED_PLATFORMS: iphoneos
      PRODUCT_BUNDLE_IDENTIFIER: app.venicanary.ios
      PRODUCT_NAME: VeniCanary
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: VeniCanary
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
      INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
      INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: NO
