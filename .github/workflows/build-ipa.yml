name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project VeniCanary.xcodeproj \
            -scheme VeniCanary \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VeniCanary.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/VeniCanary.xcarchive/Products/Applications/VeniCanary.app Payload/
          zip -r VeniCanary.ipa Payload
          ls -lh VeniCanary.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: VeniCanary-ipa
          path: VeniCanary.ipa
          if-no-files-found: error
