name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (unsigned)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project VeniCanary.xcodeproj \
            -scheme VeniCanary \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/VeniCanary.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            archive | xcpretty || true

          # Fallback without xcpretty if needed
          if [ ! -d build/VeniCanary.xcarchive ]; then
            xcodebuild \
              -project VeniCanary.xcodeproj \
              -scheme VeniCanary \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$PWD/build/VeniCanary.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive
          fi

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/VeniCanary.xcarchive/Products/Applications/VeniCanary.app"
          if [ ! -d "$APP" ]; then
            echo "App not found in archive"; ls -laR build || true; exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -r VeniCanary.ipa Payload
          ls -lh VeniCanary.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeniCanary-ipa
          path: build/VeniCanary.ipa
          retention-days: 14
