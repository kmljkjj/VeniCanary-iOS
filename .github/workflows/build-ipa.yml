name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project (format 56 / Xcode 15)
        run: |
          xcodegen generate
          # Safety: force objectVersion 56 if xcodegen still emits higher
          python3 - <<'PY'
          import plistlib, pathlib
          p = pathlib.Path("VeniCanary.xcodeproj/project.pbxproj")
          text = p.read_text(encoding="utf-8")
          # pbxproj is not pure plist always — do text replace
          import re
          text2 = re.sub(r"objectVersion = \d+", "objectVersion = 56", text, count=1)
          text2 = re.sub(r"compatibilityVersion = \"[^\"]+\"", 'compatibilityVersion = "Xcode 14.0"', text2, count=1)
          p.write_text(text2, encoding="utf-8")
          print("patched objectVersion -> 56")
          PY

      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project VeniCanary.xcodeproj \
            -scheme VeniCanary \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VeniCanary.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/VeniCanary.xcarchive/Products/Applications/VeniCanary.app Payload/
          zip -r VeniCanary.ipa Payload
          ls -lh VeniCanary.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: VeniCanary-ipa
          path: VeniCanary.ipa
          if-no-files-found: error
